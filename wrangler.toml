name = "agentsasfolders"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# KV namespace for the waitlist.
# Create it first:  wrangler kv namespace create WAITLIST
# Then paste the id below and set the same binding in the Pages dashboard.
[[kv_namespaces]]
binding = "WAITLIST"
id = "a1eb848c5e4c4819a5af65e4c9a6bde0"

[vars]
NODE_VERSION = "22"
NOTIFY_TO = "waitlist@agentsasfolders.ai"
NOTIFY_FROM = "waitlist@agentsasfolders.ai"

# Secrets, set these in the dashboard or with wrangler, never in this file:
#   RESEND_KEY   optional. No key means no notification email, signups still store.
#   EXPORT_KEY   any long random string. Guards the list export route.
